[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ida-nexus-docker"
version = "0.1.0"
description = "Run isolated IDA Nexus analyses and export runs as static websites"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["markdown-it-py>=3,<5", "Pygments>=2.18,<3", "ida-domain"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ida-run-export = "run_site.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["run_site*"]

[tool.setuptools.package-data]
run_site = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
